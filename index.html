<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Оракул</title></head><body><div class="layout"><aside id="sidebar"><div class="brand"><b>О</b><span><strong>Оракул</strong><small>персональный помощник</small></span></div><button class="nav active" data-view="chat">◌ Диалог</button><button class="nav" data-view="library">▤ Библиотека</button><div class="bottom"><button id="export">Экспорт данных</button><label>Импорт данных<input id="import" type="file" accept="application/json" hidden></label><small>Локальный режим</small></div></aside><main><header><button id="menu">☰</button><div><small>ВАШЕ ПРОСТРАНСТВО</small><h1 id="heading">Диалог</h1></div><span class="pill">● Локально</span></header><section id="chat" class="view"><div id="messages"></div><div class="composer"><textarea id="prompt" rows="1" placeholder="Напиши Оракулу…"></textarea><button id="send">↑</button></div><p class="hint">Прототип 0.1 · ИИ ещё не подключён. История хранится на этом устройстве.</p></section><section id="library" class="view hidden"><div class="libhead"><div><h2>Личная библиотека</h2><p>Заметки хранятся в браузере на этом устройстве.</p></div><button id="newnote">＋ Новая заметка</button></div><input id="search" placeholder="Поиск по заметкам…"><div id="notes"></div><div id="editor" class="hidden"><input id="ntitle" placeholder="Название заметки"><textarea id="nbody" rows="8" placeholder="Текст, идеи, ссылки…"></textarea><div class="actions"><button id="del" class="danger">Удалить</button><span></span><button id="cancel">Отмена</button><button id="save">Сохранить</button></div></div></section><footer>Оракул · Ваши данные принадлежат вам</footer></main></div><div id="toast"></div><script src="app.js"></script></body></html>
